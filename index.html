<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>MacroFit</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f8ff;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:20px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0;font-size:28px}h2{font-size:19px;margin:0 0 14px}p{color:#aebdd1;font-size:14px;line-height:1.5}.muted{color:#9cabc2}.card{background:#162237;border:1px solid #293a55;border-radius:18px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#202e46;padding:14px;border-radius:13px}.stat strong{display:block;font-size:23px}.stat small{color:#aebdd1}.tabs{position:fixed;bottom:0;left:0;right:0;background:#101b2c;border-top:1px solid #304058;display:flex;justify-content:center;z-index:5}.tabs button{flex:1;max-width:110px;padding:13px 3px;font-size:11px;border:0;background:transparent;color:#aebdd1}.tabs button.active{color:#60e6ae;font-weight:800}.btn,button.action{background:#50d9a4;color:#071d18;border:0;border-radius:11px;padding:12px 14px;font-weight:750;cursor:pointer}button.secondary{background:#2b3c57;color:#fff;border:0;border-radius:10px;padding:10px 12px}button.danger{background:#6b2c3a;color:white;border:0;border-radius:9px;padding:7px}input,select,textarea{width:100%;padding:12px;background:#0d192b;border:1px solid #41516b;border-radius:10px;color:#fff;font:inherit;margin:5px 0 12px}label{font-size:13px;color:#b7c8df}form{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}form .wide{grid-column:1/-1}.bar{height:10px;background:#34445d;border-radius:10px;overflow:hidden;margin:7px 0 14px}.fill{height:100%;background:#50d9a4}.entry{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #34435a}.entry:last-child{border:0}.entry small{display:block;color:#9fb0c6;margin-top:3px}.pill{display:inline-block;padding:4px 9px;background:#294a47;border-radius:12px;color:#80f4c3;font-size:12px}.hidden{display:none}#photoPreview{max-width:100%;border-radius:14px;display:block}#photoWrap{position:relative}.overlay{position:absolute;left:8px;right:8px;bottom:8px;background:#071421df;border-radius:12px;padding:12px;display:none}.overlay strong{font-size:22px}.tiny{font-size:12px}.notice{background:#29364a;padding:12px;border-radius:10px;font-size:12px;color:#d4deeb}a{color:#80f4c3}canvas{width:100%;border-radius:12px}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MacroFit"></head><body><main><header><div><div class="pill">FREE · LOCAL FIRST</div><h1>MacroFit <span style="color:#50d9a4">●</span></h1><p style="margin:3px 0">Fuel your progress</p></div><button class="secondary" onclick="showTab('settings')">⚙️</button></header><section id="dashboard"></section><section id="food" class="hidden"></section><section id="exercise" class="hidden"></section><section id="progress" class="hidden"></section><section id="friends" class="hidden"></section><section id="settings" class="hidden"></section></main><nav class="tabs" id="nav"></nav><script>
const defaults={targets:{cal:2200,p:160,c:255,f:60,weight:72},foods:[],exercises:[],measurements:[],friends:[],photo:null,share:{cal:false,protein:false,workouts:false,weight:false}};
let state;try{state=Object.assign({},defaults,JSON.parse(localStorage.getItem('macrofit_v1')||'{}'))}catch(e){state=structuredClone(defaults)};
const today=()=>new Date().toLocaleDateString('en-CA');const save=()=>{localStorage.setItem('macrofit_v1',JSON.stringify(state));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(x)||0;const sum=(arr,k)=>arr.filter(x=>x.date===today()).reduce((a,x)=>a+num(x[k]),0);let active='dashboard';
function showTab(t){active=t;render();window.scrollTo(0,0)}function render(){document.querySelectorAll('main section').forEach(e=>e.classList.toggle('hidden',e.id!==active));document.getElementById('nav').innerHTML=[['dashboard','🏠','Today'],['food','🍽️','Food'],['exercise','🏋️','Exercise'],['progress','📈','Progress'],['friends','👥','Friends']].map(([id,icon,label])=>`<button class="${active===id?'active':''}" onclick="showTab('${id}')">${icon}<br>${label}</button>`).join('');document.getElementById(active).innerHTML=({dashboard:dashboard,food:food,exercise:exercise,progress:progress,friends:friends,settings:settings})[active]();}
function bar(label,v,max,unit){return `<div style="display:flex;justify-content:space-between"><span>${label}</span><b>${Math.round(v)} / ${max} ${unit}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,100*v/(max||1))}%"></div></div>`}
function dashboard(){let cal=sum(state.foods,'cal'),p=sum(state.foods,'p'),c=sum(state.foods,'c'),f=sum(state.foods,'f'),burn=sum(state.exercises,'burn');return `<div class="card"><div class="muted">TODAY · ${today()}</div><h2 style="margin-top:10px">Your daily overview</h2><div class="grid"><div class="stat"><small>Calories eaten</small><strong>${Math.round(cal)}</strong><small>of ${state.targets.cal} kcal</small></div><div class="stat"><small>Exercise burned*</small><strong>${Math.round(burn)}</strong><small>estimated kcal</small></div><div class="stat"><small>Food remaining</small><strong>${Math.round(state.targets.cal-cal)}</strong><small>not adjusted for exercise</small></div><div class="stat"><small>Net calories*</small><strong>${Math.round(cal-burn)}</strong><small>food minus exercise</small></div></div></div><div class="card"><h2>Macros</h2>${bar('Protein',p,state.targets.p,'g')}${bar('Carbs',c,state.targets.c,'g')}${bar('Fat',f,state.targets.f,'g')}</div><div class="card"><h2>Quick actions</h2><button class="btn" onclick="showTab('food')">+ Add food</button> <button class="secondary" onclick="showTab('exercise')">+ Exercise</button></div><p class="tiny">*Exercise burn is an approximation and isn't automatically added to your food allowance. All data stays on this device unless you export it.</p>`}
function food(){return `<div class="card"><h2>Log a meal</h2><form onsubmit="addFood(event)"><div class="wide"><label>Food name</label><input name="name" placeholder="e.g. Chicken and rice" required></div><div><label>Calories (kcal)</label><input name="cal" type="number" min="0" step="any" required></div><div><label>Protein (g)</label><input name="p" type="number" min="0" step="any" required></div><div><label>Carbs (g)</label><input name="c" type="number" min="0" step="any" required></div><div><label>Fat (g)</label><input name="f" type="number" min="0" step="any" required></div><button class="btn wide">Add to diary</button></form></div><div class="card"><h2>Barcode lookup</h2><p>Scan using a supported browser, or type the barcode. Product information comes from Open Food Facts and may need checking.</p><input id="barcode" inputmode="numeric" placeholder="Barcode number"><button class="btn" onclick="lookupBarcode()">Find product</button> <button class="secondary" onclick="scanBarcode()">📷 Scan barcode</button><div id="barcodeResult" class="tiny" style="margin-top:10px"></div><video id="barcodeVideo" autoplay playsinline muted style="display:none;width:100%;max-height:240px;margin-top:10px"></video><button id="stopScan" class="secondary hidden" onclick="stopScan()">Stop camera</button></div><div class="card"><h2>Meal photo & nutrition overlay</h2><p>Upload a photo, then enter or correct the estimated nutrition to create a shareable overlay. Automatic AI food recognition is not yet included.</p><input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event)"><div id="photoWrap"><img id="photoPreview" style="display:none"><div id="photoOverlay" class="overlay"></div></div><div class="grid"><div><label>Meal name</label><input id="mealName" placeholder="Meal"></div><div><label>Calories</label><input id="mealCal" type="number" placeholder="kcal"></div><div><label>Protein (g)</label><input id="mealP" type="number"></div><div><label>Carbs (g)</label><input id="mealC" type="number"></div><div><label>Fat (g)</label><input id="mealF" type="number"></div></div><button class="btn" onclick="makeOverlay()">Create overlay</button> <button class="secondary" onclick="downloadOverlay()">Save image</button><canvas id="photoCanvas" style="display:none"></canvas></div><div class="card"><h2>Today's foods</h2>${entries(state.foods,'food')}</div>`}
function entries(a,type){let list=a.map((x,i)=>({...x,i})).filter(x=>x.date===today());return list.length?list.map(x=>`<div class="entry"><div><b>${esc(x.name)}</b><small>${type==='food'?`${x.cal} kcal · P ${x.p}g · C ${x.c}g · F ${x.f}g`:`${x.minutes} min · ~${x.burn} kcal`}</small></div><button class="danger" onclick="removeEntry('${type}',${x.i})">×</button></div>`).join(''):'<p>No entries yet today.</p>'}
function addFood(e){e.preventDefault();let d=new FormData(e.target);state.foods.push({date:today(),name:d.get('name'),cal:num(d.get('cal')),p:num(d.get('p')),c:num(d.get('c')),f:num(d.get('f'))});save()}
function removeEntry(type,i){(type==='food'?state.foods:state.exercises).splice(i,1);save()}
let scannedFood=null;async function lookupBarcode(){let code=document.getElementById('barcode').value.trim(),el=document.getElementById('barcodeResult');if(!/^\d{8,14}$/.test(code)){el.textContent='Enter a valid 8–14 digit barcode.';return}el.textContent='Looking up product…';try{let r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json');let j=await r.json();if(j.status!==1)throw Error('Product not found. Add it manually.');let n=j.product.nutriments||{},name=j.product.product_name||'Unknown product';let cal=num(n['energy-kcal_100g']??num(n.energy_100g)/4.184),p=num(n.proteins_100g),c=num(n.carbohydrates_100g),f=num(n.fat_100g);scannedFood={name,cal,p,c,f};el.innerHTML=`<b>${esc(name)}</b><br>Per 100 g: ${Math.round(cal)} kcal · P ${p}g · C ${c}g · F ${f}g<br><label>Amount (g)</label><input id="servingG" type="number" value="100" min="1"><button class="btn" onclick="addScanned()">Log serving</button>`}catch(e){el.textContent=e.message+' (An internet connection is required.)'}}
function addScanned(){if(!scannedFood)return;let {name,cal,p,c,f}=scannedFood;let q=num(document.getElementById('servingG').value)/100;state.foods.push({date:today(),name,cal:Math.round(cal*q),p:Math.round(p*q*10)/10,c:Math.round(c*q*10)/10,f:Math.round(f*q*10)/10});save()}
let stream=null;async function scanBarcode(){let v=document.getElementById('barcodeVideo'),out=document.getElementById('barcodeResult');if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia){out.textContent='Camera barcode scanning is not supported here. Enter the barcode manually.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.style.display='block';document.getElementById('stopScan').classList.remove('hidden');let detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});let token=stream;async function frame(){if(stream!==token)return;try{let codes=await detector.detect(v);if(codes.length){document.getElementById('barcode').value=codes[0].rawValue;stopScan();lookupBarcode();return}}catch(e){}requestAnimationFrame(frame)}frame()}catch(e){out.textContent='Camera permission unavailable. Enter barcode manually.'}}
function stopScan(){stream?.getTracks().forEach(t=>t.stop());stream=null;let v=document.getElementById('barcodeVideo');if(v)v.style.display='none';document.getElementById('stopScan')?.classList.add('hidden')}
function loadPhoto(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{state.photo=reader.result;document.getElementById('photoPreview').src=reader.result;document.getElementById('photoPreview').style.display='block'};reader.readAsDataURL(file)}
function makeOverlay(){let img=document.getElementById('photoPreview');if(!img.src){alert('Choose a meal photo first.');return}let d=['mealName','mealCal','mealP','mealC','mealF'].map(x=>document.getElementById(x).value);let ov=document.getElementById('photoOverlay');ov.style.display='block';ov.innerHTML=`<b>${esc(d[0]||'My meal')}</b><br><strong>${num(d[1])} kcal</strong><br>Protein ${num(d[2])}g · Carbs ${num(d[3])}g · Fat ${num(d[4])}g<br><small>Manual estimate · MacroFit</small>`}
function downloadOverlay(){let img=document.getElementById('photoPreview');if(!img.src){alert('Choose a photo first');return}let cv=document.getElementById('photoCanvas'),ctx=cv.getContext('2d');cv.width=900;cv.height=Math.round(900*img.naturalHeight/img.naturalWidth);ctx.drawImage(img,0,0,cv.width,cv.height);let h=150;ctx.fillStyle='#071421e8';ctx.fillRect(0,cv.height-h,cv.width,h);ctx.fillStyle='white';ctx.font='bold 32px system-ui';ctx.fillText(document.getElementById('mealName').value||'My meal',25,cv.height-h+42);ctx.font='bold 36px system-ui';ctx.fillText(`${num(document.getElementById('mealCal').value)} kcal`,25,cv.height-h+85);ctx.font='23px system-ui';ctx.fillText(`P ${num(document.getElementById('mealP').value)}g  ·  C ${num(document.getElementById('mealC').value)}g  ·  F ${num(document.getElementById('mealF').value)}g`,25,cv.height-22);let a=document.createElement('a');a.download='macrofit-meal.png';a.href=cv.toDataURL('image/png');a.click()}
const exercises={weights:[3.5,'Weight training (moderate)'],hardweights:[6,'Weight training (vigorous)'],walk:[3.5,'Brisk walking'],run:[8,'Running'],cycle:[7,'Cycling'],other:[4,'Other activity']};function exercise(){return `<div class="card"><h2>Log exercise</h2><form onsubmit="addExercise(event)"><div class="wide"><label>Activity</label><select name="type">${Object.entries(exercises).map(([k,v])=>`<option value="${k}">${v[1]}</option>`).join('')}</select></div><div><label>Duration (minutes)</label><input name="minutes" type="number" min="1" value="45" required></div><div><label>Body weight (kg)</label><input name="weight" type="number" min="1" step="0.1" value="${state.targets.weight}" required></div><button class="btn wide">Log workout</button></form><p class="tiny">Calories are estimated using MET values; actual energy expenditure varies. They do not automatically increase your food target.</p></div><div class="card"><h2>Today's exercise</h2>${entries(state.exercises,'exercise')}</div>`}
function addExercise(e){e.preventDefault();let d=new FormData(e.target),type=d.get('type'),minutes=num(d.get('minutes')),weight=num(d.get('weight'));let burn=Math.round(exercises[type][0]*3.5*weight/200*minutes);state.exercises.push({date:today(),name:exercises[type][1],minutes,burn});save()}
function progress(){return `<div class="card"><h2>Body measurements</h2><form onsubmit="addMeasurement(event)"><div><label>Weight (kg)</label><input name="weight" type="number" step="0.1" min="1" value="${state.targets.weight}" required></div><div><label>Body fat (%) estimate</label><input name="bf" type="number" step="0.1" min="1" max="70" placeholder="20"></div><div class="wide"><label>Waist (cm), optional</label><input name="waist" type="number" step="0.1" min="1"></div><button class="btn wide">Save today's measurement</button></form></div><div class="card"><h2>Progress history</h2>${state.measurements.length?[...state.measurements].reverse().map(x=>`<div class="entry"><div><b>${esc(x.date)} · ${x.weight} kg</b><small>Body fat: ${x.bf||'—'}% · Waist: ${x.waist||'—'} cm</small></div></div>`).join(''):'<p>No measurements yet.</p>'}</div><p>Body-fat readings are estimates. Consistent measurements and photos are more useful than a single reading.</p>`}
function addMeasurement(e){e.preventDefault();let d=new FormData(e.target);state.measurements.push({date:today(),weight:num(d.get('weight')),bf:d.get('bf'),waist:d.get('waist')});save()}
function friends(){return `<div class="card"><h2>Friends & sharing</h2><div class="notice">This version is local-only. You can keep a friend list, but real invitations, account syncing and viewing each other's live tracking require a secure online service. No private tracking data is shared automatically.</div><form onsubmit="addFriend(event)" style="margin-top:15px"><div class="wide"><label>Friend nickname</label><input name="name" placeholder="e.g. Alex" required maxlength="40"></div><button class="btn wide">Add to local friends list</button></form>${state.friends.map((f,i)=>`<div class="entry"><b>${esc(f)}</b><button class="danger" onclick="state.friends.splice(${i},1);save()">Remove</button></div>`).join('')}</div><div class="card"><h2>Share a progress summary</h2><p>Only includes the information you select. Use your phone's Share menu after copying.</p>${[['cal','Calories'],['protein','Protein'],['workouts','Workout calories'],['weight','Latest weight']].map(([k,l])=>`<label style="display:block;padding:8px"><input type="checkbox" style="width:auto;margin-right:8px" ${state.share[k]?'checked':''} onchange="state.share.${k}=this.checked;save()">${l}</label>`).join('')}<button class="btn" onclick="copySummary()">Copy selected summary</button></div>`}
function addFriend(e){e.preventDefault();state.friends.push(new FormData(e.target).get('name'));save()}
function copySummary(){let a=['MacroFit progress · '+today()];if(state.share.cal)a.push('Food: '+Math.round(sum(state.foods,'cal'))+' kcal');if(state.share.protein)a.push('Protein: '+Math.round(sum(state.foods,'p'))+' g');if(state.share.workouts)a.push('Estimated exercise burn: '+Math.round(sum(state.exercises,'burn'))+' kcal');if(state.share.weight&&state.measurements.length)a.push('Weight: '+state.measurements.at(-1).weight+' kg');navigator.clipboard?.writeText(a.join('\n')).then(()=>alert('Summary copied')).catch(()=>prompt('Copy your summary:',a.join('\n')))}
function settings(){return `<div class="card"><h2>Your goals</h2><form onsubmit="updateSettings(event)">${[['cal','Calories (kcal)'],['p','Protein (g)'],['c','Carbs (g)'],['f','Fat (g)'],['weight','Weight goal (kg)']].map(([k,l])=>`<div><label>${l}</label><input name="${k}" type="number" min="1" step="any" value="${state.targets[k]}"></div>`).join('')}<button class="btn wide">Save goals</button></form></div><div class="card"><h2>Your data</h2><p>Your diary is stored in this browser on this device. Clearing browser storage can erase it. Export regularly.</p><button class="btn" onclick="exportData()">Export backup (.json)</button> <label style="display:inline-block;background:#2b3c57;border-radius:10px;padding:11px">Import backup<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div><div class="card"><h2>What's coming later</h2><p>Real friend accounts and syncing, native iOS packaging, and automatic online AI photo nutrition recognition are not implemented in this offline-first version. Barcode lookup requires internet and browser camera scanning depends on device support.</p></div>`}
function updateSettings(e){e.preventDefault();let d=new FormData(e.target);for(let k of Object.keys(state.targets))state.targets[k]=num(d.get(k));save()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='macrofit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let j=JSON.parse(reader.result);if(!j.targets||!Array.isArray(j.foods)||!Array.isArray(j.exercises))throw Error('Invalid backup');if(confirm('Replace current app data with this backup?')){state=Object.assign({},defaults,j);save()}}catch(err){alert('Could not import backup: '+err.message)}};reader.readAsText(file)}
render();if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
